version: 2
updates:
  - package-ecosystem: npm
    directories: ['/', '/backend', '/frontend']
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 has no JS API yet (typescript-eslint supports < 6.1) and
      # eslint-config-next's plugins support ESLint 9 only. See docs/DECISIONS.md.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # Type definitions must match the Node 24 runtime on Render and Vercel.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(ci)'
